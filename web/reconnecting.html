<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Под перезапускается — Comfy Course Deployer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #161618;
      --card: #232327;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --border: rgba(255, 255, 255, 0.10);
      --accent: #0b8ce9;
      --accent-hover: #259df4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }
    .box {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px 24px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 12px 32px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center;
    }
    .spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
    }
    button {
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      cursor: pointer;
      color: var(--text);
      background: rgba(255, 255, 255, 0.07);
    }
    button.primary {
      background: var(--accent);
      border-color: transparent;
      color: #fff;
    }
    button.primary:hover {
      background: var(--accent-hover);
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Под временно недоступен или перезагружается</h1>
    <p id="status-text">RunPod вернул ошибку шлюза (502/503). Автоматическая проверка каждые 4 секунды…</p>
    <div class="actions">
      <button type="button" id="back-btn" class="primary">← Вернуться в деплойер</button>
      <button type="button" id="retry-btn">Проверить сейчас</button>
    </div>
  </div>
  <script>
    const statusText = document.getElementById("status-text");
    document.getElementById("back-btn").addEventListener("click", async () => {
      await fetch("/__rp_bridge/disconnect", { method: "POST" });
      window.location.reload();
    });
    async function checkReady() {
      try {
        const res = await fetch("/", { cache: "no-store" });
        if (res.ok && res.headers.get("X-RP-Reconnecting") !== "1") {
          window.location.reload();
          return;
        }
        statusText.textContent = "Под ещё запускается или выключен. Повторная проверка через 4 сек…";
      } catch {
        statusText.textContent = "Ожидание ответа от пода…";
      }
    }
    document.getElementById("retry-btn").addEventListener("click", checkReady);
    setInterval(checkReady, 4000);
  </script>
</body>
</html>
